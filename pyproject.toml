[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "splitproof"
version = "0.1.0"
description = "Reproducible, group-aware dataset splits with verifiable manifests"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Wei Ping" }]
keywords = ["nlp", "dataset", "splitting", "reproducibility", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
splitproof = "splitproof.cli:main"

[project.urls]
Documentation = "https://github.com/appleweiping/splitproof#readme"
Issues = "https://github.com/appleweiping/splitproof/issues"
Source = "https://github.com/appleweiping/splitproof"

[tool.hatch.build.targets.wheel]
packages = ["src/splitproof"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=splitproof --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["splitproof"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
