[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "splitproof"
version = "0.2.0"
description = "Weighted, multi-label, group-aware dataset splits with verifiable manifests"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Wei Ping" }]
keywords = [
  "nlp",
  "dataset",
  "splitting",
  "reproducibility",
  "machine-learning",
  "multilabel",
  "weighted",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "twine>=5",
]

[project.scripts]
splitproof = "splitproof.cli:main"

[project.urls]
Changelog = "https://github.com/appleweiping/splitproof/blob/main/CHANGELOG.md"
Discussions = "https://github.com/appleweiping/splitproof/discussions"
Documentation = "https://github.com/appleweiping/splitproof#readme"
Issues = "https://github.com/appleweiping/splitproof/issues"
Source = "https://github.com/appleweiping/splitproof"

[tool.hatch.build.targets.wheel]
packages = ["src/splitproof"]

[tool.hatch.build.targets.sdist]
include = [
  "/benchmarks",
  "/docs",
  "/examples",
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/MAINTAINERS.md",
  "/README.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=splitproof --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["splitproof"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
