[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "splitproof"
version = "0.3.0"
description = "Train/test splits and cross-validation folds for text data that keep near-duplicates on the same side"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Weiping Yan" }]
keywords = ["nlp", "dataset", "train-test-split", "cross-validation", "near-duplicates", "data-leakage", "minhash"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
sklearn = ["scikit-learn>=1.3"]
bench = ["iterative-stratification>=0.1.9", "pyarrow>=12", "scikit-learn>=1.3"]
dev = ["mypy>=1.11", "pyarrow>=12", "pytest>=8", "ruff>=0.8", "scikit-learn>=1.3"]

[project.scripts]
splitproof = "splitproof.cli:main"

[project.urls]
Source = "https://github.com/appleweiping/splitproof"
Issues = "https://github.com/appleweiping/splitproof/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/splitproof"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
ignore_missing_imports = true
